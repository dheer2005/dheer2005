<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260">

  <defs>
    <linearGradient id="gradPP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e88"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0620"/>
      <stop offset="100%" stop-color="#1a0533"/>
    </linearGradient>
    <clipPath id="roundedCard"><rect x="0" y="0" width="480" height="260" rx="16"/></clipPath>
  </defs>

  <style>
    <![CDATA[
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace; }
    .fadeSlide { opacity: 0; animation: fadeSlide .7s ease forwards; }
    @keyframes fadeSlide { from { opacity:0; transform: translateX(-14px); } to { opacity:1; transform: translateX(0); } }
    .barFill { animation: grow 1.3s cubic-bezier(.2,.8,.3,1) forwards; transform-origin: left; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .ringDraw { animation: ringDraw 1.6s cubic-bezier(.3,.8,.3,1) forwards; }
    @keyframes ringDraw { from { stroke-dashoffset: var(--circ); } to { stroke-dashoffset: var(--offset); } }
    .popIn { opacity:0; animation: popIn .55s cubic-bezier(.2,1.4,.4,1) forwards; }
    @keyframes popIn { 0%{opacity:0; transform:scale(.6) translateY(10px);} 60%{opacity:1; transform:scale(1.08);} 100%{opacity:1; transform:scale(1);} }
    .shine { animation: shine 4.5s ease-in-out infinite; }
    @keyframes shine { 0%{transform:translate(-60px,-60px);} 50%{transform:translate(60px,60px);} 100%{transform:translate(60px,60px);} }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
    .spin { animation: spin 10s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    ]]>
  </style>
  
    <rect x="0" y="0" width="480" height="260" rx="16" fill="url(#bgGrad)" stroke="#5b2a8f"/>
    <g clip-path="url(#roundedCard)"><rect class="shine" width="70" height="520" fill="#ffffff" opacity="0.03" transform="rotate(20)"/></g>
    <text x="20" y="30" class="mono" font-size="15" font-weight="700" fill="#f5e9ff">GitHub Stats</text>
    <line x1="20" y1="40" x2="460" y2="40" stroke="#5b2a8f" stroke-opacity="0.6"/>
  <g transform="translate(100,150)">
    <circle r="54" fill="none" stroke="#5b2a8f" stroke-opacity="0.35" stroke-width="10"/>
    <circle class="ringDraw spin" style="--circ:339.29; --offset:74.64" r="54" fill="none" stroke="url(#gradPP)" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="339.29" stroke-dashoffset="339.29" transform="rotate(-90)"/>
    <text x="0" y="-4" text-anchor="middle" class="mono" font-size="24" font-weight="700" fill="#f5e9ff">A+</text>
    <text x="0" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#b79ad6">RANK</text>
  </g>
  
      <g class="fadeSlide" style="animation-delay:0.25s" transform="translate(200,78)">
        <text x="0" y="0" class="mono" font-size="12.5" fill="#b79ad6">Total Stars</text>
        <text x="260" y="0" text-anchor="end" class="mono" font-size="12.5" fill="#f5e9ff">128</text>
        <rect x="0" y="8" width="260" height="6" rx="3" fill="#5b2a8f" opacity="0.35"/>
        <rect x="0" y="8" width="143" height="6" rx="3" fill="url(#gradPP)" class="barFill" style="animation-delay:0.4s"/>
      </g>
      <g class="fadeSlide" style="animation-delay:0.39s" transform="translate(200,112)">
        <text x="0" y="0" class="mono" font-size="12.5" fill="#b79ad6">Total Commits</text>
        <text x="260" y="0" text-anchor="end" class="mono" font-size="12.5" fill="#f5e9ff">740+</text>
        <rect x="0" y="8" width="260" height="6" rx="3" fill="#5b2a8f" opacity="0.35"/>
        <rect x="0" y="8" width="213" height="6" rx="3" fill="url(#gradPP)" class="barFill" style="animation-delay:0.54s"/>
      </g>
      <g class="fadeSlide" style="animation-delay:0.53s" transform="translate(200,146)">
        <text x="0" y="0" class="mono" font-size="12.5" fill="#b79ad6">Repositories</text>
        <text x="260" y="0" text-anchor="end" class="mono" font-size="12.5" fill="#f5e9ff">24</text>
        <rect x="0" y="8" width="260" height="6" rx="3" fill="#5b2a8f" opacity="0.35"/>
        <rect x="0" y="8" width="104" height="6" rx="3" fill="url(#gradPP)" class="barFill" style="animation-delay:0.68s"/>
      </g>
      <g class="fadeSlide" style="animation-delay:0.67s" transform="translate(200,180)">
        <text x="0" y="0" class="mono" font-size="12.5" fill="#b79ad6">Followers</text>
        <text x="260" y="0" text-anchor="end" class="mono" font-size="12.5" fill="#f5e9ff">36</text>
        <rect x="0" y="8" width="260" height="6" rx="3" fill="#5b2a8f" opacity="0.35"/>
        <rect x="0" y="8" width="78" height="6" rx="3" fill="url(#gradPP)" class="barFill" style="animation-delay:0.8200000000000001s"/>
      </g>
  <text x="20" y="246" class="mono" font-size="9.5" fill="#b79ad6" opacity="0.7">edit values in stats.svg • static local card</text>
</svg>