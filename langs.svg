<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">

  <defs>
    <linearGradient id="gradPP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e88"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0620"/>
      <stop offset="100%" stop-color="#1a0533"/>
    </linearGradient>
    <clipPath id="roundedCard"><rect x="0" y="0" width="480" height="300" rx="16"/></clipPath>
  </defs>

  <style>
    <![CDATA[
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace; }
    .fadeSlide { opacity: 0; animation: fadeSlide .7s ease forwards; }
    @keyframes fadeSlide { from { opacity:0; transform: translateX(-14px); } to { opacity:1; transform: translateX(0); } }
    .barFill { animation: grow 1.3s cubic-bezier(.2,.8,.3,1) forwards; transform-origin: left; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .ringDraw { animation: ringDraw 1.6s cubic-bezier(.3,.8,.3,1) forwards; }
    @keyframes ringDraw { from { stroke-dashoffset: var(--circ); } to { stroke-dashoffset: var(--offset); } }
    .popIn { opacity:0; animation: popIn .55s cubic-bezier(.2,1.4,.4,1) forwards; }
    @keyframes popIn { 0%{opacity:0; transform:scale(.6) translateY(10px);} 60%{opacity:1; transform:scale(1.08);} 100%{opacity:1; transform:scale(1);} }
    .shine { animation: shine 4.5s ease-in-out infinite; }
    @keyframes shine { 0%{transform:translate(-60px,-60px);} 50%{transform:translate(60px,60px);} 100%{transform:translate(60px,60px);} }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
    .spin { animation: spin 10s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    ]]>
  </style>
  
    <rect x="0" y="0" width="480" height="300" rx="16" fill="url(#bgGrad)" stroke="#5b2a8f"/>
    <g clip-path="url(#roundedCard)"><rect class="shine" width="70" height="600" fill="#ffffff" opacity="0.03" transform="rotate(20)"/></g>
    <text x="20" y="30" class="mono" font-size="15" font-weight="700" fill="#f5e9ff">Most Used Languages</text>
